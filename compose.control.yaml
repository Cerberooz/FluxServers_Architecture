# Control-plane stack for the VPS that hosts the Panel and its internal data.
#
# Public traffic should still terminate at host Nginx/Caddy and proxy
# panel.fluxservers.cloud to 127.0.0.1:18080.
name: fluxservers-control

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_DATABASE: ${PANEL_DB_DATABASE:-panel}
      MYSQL_USER: ${PANEL_DB_USERNAME:-panel}
      MYSQL_PASSWORD: ${PANEL_DB_PASSWORD:?Set PANEL_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${PANEL_MYSQL_ROOT_PASSWORD:?Set PANEL_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - panel_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - panel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  panel:
    build:
      context: ./FluxPanel
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    env_file:
      - ./FluxPanel/.env
    volumes:
      - panel_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./FluxPanel
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./FluxPanel/.env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - panel_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./FluxPanel
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./FluxPanel/.env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - panel_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  panel_mariadb_data:
    name: fluidpanel_mariadb_data
  panel_redis_data:
    name: fluidpanel_redis_data
  panel_storage:
    name: fluidpanel_storage
