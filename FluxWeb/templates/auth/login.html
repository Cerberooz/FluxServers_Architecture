{% extends "base.html" %}

{% block title %}Login - Flux Servers{% endblock %}

{% block content %}
<section class="hero" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 0 60px;">
    <div class="container" style="max-width: 450px;">
        <div class="glass-card" style="padding: 40px; border-radius: 24px; text-align: center;">
            <h1 class="animated-title" style="font-size: 32px; margin-bottom: 8px;">Welcome <span class="highlight">Back</span></h1>
            <p style="margin-bottom: 32px; color: var(--text-muted);">Access your dashboard and manage your servers.</p>

            <form method="POST" action="" style="display: grid; gap: 20px; text-align: left;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="input-field">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" required 
                           style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text);">
                </div>

                <div class="input-field">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required 
                           style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text);">
                    <p style="margin: 10px 0 0; text-align: right;">
                        <a href="/forgot-password"
                           style="color: var(--text-muted); font-size: 13px; text-decoration: none;">
                            Forgot your password?
                        </a>
                    </p>
                </div>

                <button type="submit" class="button" style="width: 100%; height: 55px; border-radius: 12px; margin-top: 10px;">
                    <span>Login to Account</span>
                    <div class="hoverEffect"><div></div></div>
                </button>
            </form>

            {% include "auth/_oauth_buttons.html" %}

            <p style="margin-top: 32px; font-size: 14px; color: var(--text-muted);">
                Don't have an account? <a href="/register{% if request.args.get('url') %}?url={{ request.args.get('url') }}{% endif %}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register now</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
