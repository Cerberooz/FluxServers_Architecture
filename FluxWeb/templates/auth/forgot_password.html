{% extends "base.html" %}

{% block title %}Reset Password - Flux Servers{% endblock %}

{% block content %}
<section class="auth-section" style="padding: 80px 0; min-height: 70vh;">
    <div class="container" style="max-width: 460px;">
        <div class="auth-card" style="padding: 34px; border-radius: 16px; background: var(--card-bg, rgba(255,255,255,0.03));
             border: 1px solid rgba(255,255,255,0.08);">
            <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Forgot your password?</h1>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">
                Enter your account email and we'll send you a link to choose a new password.
                The link expires in one hour.
            </p>

            <form method="POST" action="/forgot-password">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="email" style="display: block; font-size: 12px; font-weight: 600;
                       text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Email address</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                       style="width: 100%; padding: 12px 14px; border-radius: 8px; margin-bottom: 18px;">

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
                    Send reset link
                </button>
            </form>

            <p style="margin-top: 20px; font-size: 13px; text-align: center;">
                <a href="/login" style="color: var(--primary-color);">Back to sign in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
