{% extends "base.html" %}

{% block title %}404 - Page Not Found | Flux Servers{% endblock %}

{% block content %}
<section class="hero" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div style="text-align: center;">
            <h1 style="font-size: 120px; margin-bottom: 0; line-height: 1; opacity: 0.1;">404</h1>
            <h2 class="animated-title" style="margin-top: -60px;">Lost in <span class="highlight">Space?</span></h2>
            <p style="font-size: 18px; color: var(--text-muted); max-width: 500px; margin: 20px auto 40px;">
                The page you are looking for doesn't exist or has been moved to another dimension.
            </p>
            <div class="hero-buttons">
                <a href="/" class="btn">Return Home</a>
                <a href="/minecraft" class="btn-outline">Browse Plans</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
